name: Daily Marugame Gacha (Dry Run)

on:
  schedule:
    - cron: "0 3 * * *" # 毎日12:00 JST
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリインストール
        run: |
          pip install tweepy

      - name: ガチャ実行（投稿なし）
        run: |
          python auto_post/post_x.py